exclude: 'node_modules|^\.git/(?!COMMIT_EDITMSG$)'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "seal_hrms.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]
        stages: [manual]

      - id: ruff
        name: "Run ruff linter"
        stages: [manual]

      - id: ruff-format
        stages: [manual]
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        stages: [manual]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                seal_hrms/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                seal_hrms/templates/includes/.*|
                seal_hrms/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        stages: [manual]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                seal_hrms/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                seal_hrms/templates/includes/.*|
                seal_hrms/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: seal-docs-check
        name: user docs cover the app (SEAL_DEV_RULES §1.19)
        entry: bash -c 'd=$PWD; while [ "$d" != / ] && [ ! -x "$d/env/bin/python" ]; do d=$(dirname "$d"); done; exec "$d/env/bin/python" -m seal_common.help_docs check --strict --repo .'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: seal-docs-commit-msg
        name: user docs travel with the change (SEAL_DEV_RULES §1.19)
        entry: bash -c 'd=$PWD; while [ "$d" != / ] && [ ! -x "$d/env/bin/python" ]; do d=$(dirname "$d"); done; exec "$d/env/bin/python" -m seal_common.help_docs.commit_msg "$@"' --
        language: system
        always_run: true
        stages: [commit-msg]

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
